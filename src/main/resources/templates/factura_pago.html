<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Factura</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; padding: 30px; }
        .factura { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,.1); }
        @media print { body { background: white; padding: 0; } .no-print { display: none; } .factura { box-shadow: none; } }
    </style>
</head>
<body>
<div class="factura">
    <div class="d-flex justify-content-between border-bottom pb-3 mb-4">
        <div>
            <h2 class="mb-0">💳 Cobros INO</h2>
            <small class="text-muted">Comprobante de pago</small>
        </div>
        <div class="text-end">
            <h5 class="mb-0">Factura N.º <span th:text="${#numbers.formatInteger(pago.idPago, 6)}"></span></h5>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-6">
            <strong>Estudiante</strong><br>
            <span th:text="${pago.estudiante}"></span>
        </div>
        <div class="col-6 text-end">
            <strong>Registrado por</strong><br>
            <span th:text="${usuario}"></span>
        </div>
    </div>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr><th>Concepto</th><th>Método</th><th>Estado</th><th class="text-end">Monto</th></tr>
        </thead>
        <tbody>
            <tr>
                <td th:text="'Mensualidad ' + ${mensualidad.mes} + '/' + ${mensualidad.anio}"></td>
                <td th:text="${pago.metodoPago}"></td>
                <td th:text="${pago.estado}"></td>
                <td class="text-end" th:text="'$' + ${mensualidad.monto}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" class="text-end">TOTAL</th>
                <th class="text-end" th:text="'$' + ${mensualidad.monto}"></th>
            </tr>
        </tfoot>
    </table>

    <p class="text-center text-muted mt-4">Gracias por su pago</p>

    <div class="text-center no-print mt-4">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        <a th:href="@{/pagos}" class="btn btn-secondary">⬅ Volver</a>
    </div>
</div>
</body>
</html>
