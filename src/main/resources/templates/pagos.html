<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Pagos | Cobros INO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --rosa-fondo: #fdf2f6;
            --rosa-suave: #f8d7e3;
            --rosa-medio: #f4a9c3;
            --rosa-fuerte: #e07aa3;
            --rosa-texto: #7a3350;
        }

        body { background-color: var(--rosa-fondo); padding: 20px; }

        .card { box-shadow: 0 4px 10px rgba(224,122,163,0.2); border: none; margin-bottom: 25px; padding: 20px; border-radius: 14px; }
        .title-gradient { color: var(--rosa-texto); font-weight: bold; margin-bottom: 20px; }

        .sidebar { background: linear-gradient(135deg, var(--rosa-medio), var(--rosa-fuerte)); padding: 20px; border-radius: 14px; color: white; margin-bottom: 20px; }
        .sidebar .title-gradient { color: white; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 8px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.25); }

        .btn-primary { background-color: var(--rosa-fuerte); border-color: var(--rosa-fuerte); }
        .btn-primary:hover { background-color: #cf6591; border-color: #cf6591; }
        .btn-warning { background-color: #ffd6a5; border-color: #ffd6a5; color: #7a4a1d; }
        .btn-info { background-color: var(--rosa-medio) !important; border-color: var(--rosa-medio) !important; }
        .btn-secondary { background-color: #c9a3b5; border-color: #c9a3b5; }
        .btn-success { background-color: #a8d8b9; border-color: #a8d8b9; color: #2f5d42; }
        .btn-danger { background-color: #f28b9b; border-color: #f28b9b; }

        .table-dark { --bs-table-bg: var(--rosa-fuerte); --bs-table-color: white; }
        .table-striped > tbody > tr:nth-of-type(odd) > * { --bs-table-accent-bg: var(--rosa-fondo); }

        .form-control:focus, .form-select:focus { border-color: var(--rosa-medio); box-shadow: 0 0 0 0.2rem rgba(244,169,195,0.35); }
        .form-label { color: var(--rosa-texto); }
    </style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <h2 class="title-gradient text-white">💳 Cobros INO</h2>
        <a th:href="@{/usuarios/dashboard}">🏠 Dashboard</a>
        <a th:href="@{/pagos}" class="active">💰 Pagos</a>
    </aside>

    <main class="main">

        <div th:if="${mensaje}" class="alert alert-success" role="alert">
            <span th:text="${mensaje}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- FORMULARIO -->
        <div class="card bg-white">
            <h2 class="title-gradient">Registrar Pago</h2>

            <form th:action="@{/pagos/guardar}" method="post">

                <input type="hidden" name="idPago" th:value="${pago.idPago}">

                <div class="row g-3">

                    <div class="col-md-8">
                        <label class="form-label">Mensualidad</label>
                        <select class="form-select" name="idMensualidad" required>
                            <option value="">Seleccione una mensualidad</option>
                            <option th:each="m : ${mensualidades}"
                                    th:value="${m.idMensualidad}"
                                    th:selected="${pago.idMensualidad != null and pago.idMensualidad == m.idMensualidad}"
                                    th:text="${m.estudiante.nombres + ' ' + m.estudiante.apellidos + ' - ' + m.mes + '/' + m.anio + ' - $' + m.monto}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Registrado por</label>
                        <select class="form-select" name="idUsuario">
                            <option value="">Automático (usuario con sesión)</option>
                            <option th:each="u : ${usuarios}"
                                    th:value="${u['id_usuario']}"
                                    th:selected="${pago.idUsuario != null and pago.idUsuario == u['id_usuario']}"
                                    th:text="${u['username']}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Método de Pago</label>
                        <select class="form-select" name="metodoPago" required>
                            <option value="">Seleccione</option>
                            <option value="Efectivo" th:selected="${pago.metodoPago == 'Efectivo'}">Efectivo</option>
                            <option value="Transferencia" th:selected="${pago.metodoPago == 'Transferencia'}">Transferencia</option>
                            <option value="Tarjeta" th:selected="${pago.metodoPago == 'Tarjeta'}">Tarjeta</option>
                            <option value="Cheque" th:selected="${pago.metodoPago == 'Cheque'}">Cheque</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" name="estado" required>
                            <option value="Pagado" th:selected="${pago.estado == 'Pagado'}">Pagado</option>
                            <option value="Pendiente" th:selected="${pago.estado == 'Pendiente'}">Pendiente</option>
                            <option value="Anulado" th:selected="${pago.estado == 'Anulado'}">Anulado</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Activo</label>
                        <select class="form-select" name="activo" required>
                            <option value="true" th:selected="${pago.activo == null or pago.activo}">Sí</option>
                            <option value="false" th:selected="${pago.activo != null and !pago.activo}">No</option>
                        </select>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">💾 Guardar</button>
                    <button type="submit" th:formaction="@{/pagos/actualizar}" class="btn btn-warning">✏️ Actualizar</button>
                    <a th:href="@{/pagos}" class="btn btn-secondary">🧹 Limpiar</a>
                </div>

            </form>
        </div>

        <!-- GENERAR MENSUALIDADES -->
        <div class="card bg-white">
            <h2 class="title-gradient">Generar mensualidades</h2>
            <form th:action="@{/pagos/generar}" method="post">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Año</label>
                        <input type="number" class="form-control" name="anio" value="2026" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Mes desde</label>
                        <input type="number" class="form-control" name="mesDesde" min="1" max="12" value="10" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Mes hasta</label>
                        <input type="number" class="form-control" name="mesHasta" min="1" max="12" value="12" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Monto (opcional)</label>
                        <input type="number" step="0.01" class="form-control" name="monto" placeholder="Usar el de cada uno">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">➕ Generar</button>
            </form>
        </div>

        <!-- BUSCAR -->
        <div class="card bg-white">
            <h2 class="title-gradient">Buscar pago</h2>

            <form th:action="@{/pagos/buscar}" method="get">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Nombre del estudiante</label>
                        <input type="text" class="form-control" name="estudiante" required>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-info text-white w-100">🔎 Buscar</button>
                    </div>
                </div>
            </form>

            <div class="mt-3 d-flex gap-2">
                <a th:href="@{/pagos}" class="btn btn-secondary btn-sm">📋 Todos</a>
                <a th:href="@{/pagos/filtrar(estado='Pagado')}" class="btn btn-success btn-sm">✅ Pagados</a>
                <a th:href="@{/pagos/filtrar(estado='Pendiente')}" class="btn btn-warning btn-sm">⏳ Pendientes</a>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card bg-white">
            <h2 class="title-gradient">Historial de Pagos</h2>

            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>ID Mensualidad</th>
                        <th>ID Usuario</th>
                        <th>Estudiante</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${listaPagos}">
                        <td th:text="${p.idPago}"></td>
                        <td th:text="${p.idMensualidad}"></td>
                        <td th:text="${p.idUsuario}"></td>
                        <td th:text="${p.estudiante}"></td>
                        <td th:text="${p.metodoPago}"></td>
                        <td th:text="${p.estado}"></td>
                        <td>
                            <span th:if="${p.activo != null and p.activo}" class="badge bg-success">Sí</span>
                            <span th:unless="${p.activo != null and p.activo}" class="badge bg-secondary">No</span>
                        </td>
                        <td>
                            <a th:href="@{/pagos/factura/{id}(id=${p.idPago})}" target="_blank" class="btn btn-sm btn-success">🧾</a>
                            <a th:href="@{/pagos/editar/{id}(id=${p.idPago})}" class="btn btn-sm btn-warning">✏️</a>
                            <a th:href="@{/pagos/eliminar/{id}(id=${p.idPago})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar este pago?')">🗑️</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaPagos)}">
                        <td colspan="8" class="text-center text-muted">
                            No hay pagos registrados
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

</body>
</html>
